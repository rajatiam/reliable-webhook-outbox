services:
  app:
    build: .
    ports:
      - "127.0.0.1:8116:8116"
    volumes:
      - app-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8116/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
volumes:
  app-data:
